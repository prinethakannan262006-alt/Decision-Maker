{% extends "base.html" %}

{% block title %}403 - Forbidden | Decision Maker{% endblock %}

{% block content %}
<div class="max-w-3xl mx-auto px-4 py-20 sm:py-28 text-center space-y-6">
    <div class="inline-flex items-center justify-center w-20 h-20 rounded-3xl bg-amber-50 text-amber-600 border border-amber-200 text-3xl font-black">
        403
    </div>
    <div class="space-y-2">
        <h1 class="text-3xl sm:text-4xl font-black text-slate-900 tracking-tight">403 Forbidden</h1>
        <p class="text-slate-600 text-base max-w-md mx-auto">{{ description }}</p>
    </div>
    <div class="pt-4 flex flex-col sm:flex-row items-center justify-center gap-4">
        <a href="{{ url_for('main.index') }}" class="px-6 py-3 rounded-xl bg-indigo-600 hover:bg-indigo-700 text-white font-bold text-sm shadow-md transition-all">Back to Home</a>
        <button onclick="window.openChatWithContext('What does error 403 mean?', true)" class="px-6 py-3 rounded-xl bg-slate-100 hover:bg-slate-200 text-slate-800 font-bold text-sm border border-slate-200 transition-all">Ask Assistant</button>
    </div>
</div>
{% endblock %}
